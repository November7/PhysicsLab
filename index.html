<!DOCTYPE html>
<html lang="pl" class="index-page">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="AlgorithmsLab - interaktywne symulacje znanych algorytmów.">
    <title>AlgorithmsLab</title>
    <link rel="stylesheet" href="vendor/github-markdown.min.css">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page markdown-body">
      <div id="readme">Ładowanie…</div>
      <section id="algorithms" hidden>
        <h2>Algorytmy</h2>
        <ul id="algorithmIndex"></ul>
      </section>
    </main>
    <script src="vendor/marked.min.js"></script>
    <script>
      const slug = text => text.trim().toLowerCase().replace(/\s+/g, '-');

      async function load(url, type) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`${url}: ${response.status}`);
        return type === 'json' ? response.json() : response.text();
      }

      function renderAlgorithms(items) {
        const list = document.getElementById('algorithmIndex');
        list.replaceChildren(...items.map(item => {
          const li = document.createElement('li');
          if (item.status === 'published' && item.url) {
            const a = document.createElement('a');
            a.href = item.url;
            a.textContent = item.title;
            li.append(a);
            if (item.description) li.append(' - ' + item.description);
          } else {
            li.append(item.title + ' (planowane)');
          }
          return li;
        }));
        document.getElementById('algorithms').hidden = false;
      }

      (async () => {
        const readme = document.getElementById('readme');
        try {
          readme.innerHTML = marked.parse(await load('README.md', 'text'));
          // marked 15 does not add heading ids, which the README language badges rely on.
          readme.querySelectorAll('h1, h2, h3').forEach(h => { h.id = slug(h.textContent); });
        } catch (error) {
          readme.textContent = 'Nie udało się wczytać README.md. Otwórz stronę przez serwer HTTP lub GitHub Pages.';
          console.error(error);
        }
        try {
          renderAlgorithms(await load('algorithms.json', 'json'));
        } catch (error) {
          console.error(error);
        }
      })();
    </script>
  </body>
</html>
